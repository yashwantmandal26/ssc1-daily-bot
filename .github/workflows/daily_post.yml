name: Daily SSC CGL Viral Reel & Mini Mock

on:
  schedule:
    # 2x Daily at India peak study/scroll times (off-peak cron minutes):
    # - Morning: 8:17 AM IST (02:47 UTC) -> Mon/Tue/Thu/Fri/Sat: Viral Reel; Wed/Sun: 4-Slide iOS Mini Mock
    # - Evening: 7:17 PM IST (13:47 UTC) -> Daily Viral Open-Loop Quiz Reel
    - cron: '47 2 * * *'
    - cron: '47 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Post format (auto = 2x/day hybrid schedule, reel = Viral Reel, carousel = 4-Slide Mini Mock)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - reel
          - carousel

permissions:
  contents: write

jobs:
  render-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Noto Hindi/Serif fonts & ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -q selenium pillow jinja2 requests

      - name: Render Viral Reel or iOS Mini Mock Carousel
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python3 auto_post.py --render-only --mode "$MODE"

      - name: Commit rendered media so Meta API can fetch public URLs
        run: |
          git config user.name "SSC1 Daily Bot"
          git config user.email "bot@ssc1.daily"
          git add published/
          if ! git diff --cached --quiet; then
            git commit -m "Render SSC CGL daily post media"
            git push
          fi

      - name: Publish to Instagram via Official Meta Graph API
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          sleep 10
          python3 auto_post.py --publish-only

      - name: Save updated posted status in reel_pyqs.json / pyqs.json
        run: |
          git config user.name "SSC1 Daily Bot"
          git config user.email "bot@ssc1.daily"
          git add pyqs.json reel_pyqs.json
          if ! git diff --cached --quiet; then
            git commit -m "Mark published SSC CGL PYQ(s) as posted"
            git push
          fi
