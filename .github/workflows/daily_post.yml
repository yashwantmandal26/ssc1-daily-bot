name: Daily SSC CGL Carousel Post

on:
  schedule:
    # Off-peak daily schedule: 8:47 AM IST (03:17 UTC) to avoid :00/:30 queue delays
    - cron: "17 3 * * *"
  workflow_dispatch: # Manual 1-click trigger anytime

permissions:
  contents: write

jobs:
  render-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hindi fonts & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core ffmpeg
          pip install -q jinja2 pillow selenium requests

      - name: Render next unposted Carousel or 7s Quiz Reel
        run: python3 auto_post.py --render-only

      - name: Commit and push rendered media so raw GitHub URLs go live
        run: |
          if [ -f ".pending_post.json" ]; then
            git config user.name "ssc1-daily-bot"
            git config user.email "bot@users.noreply.github.com"
            git add published/
            git commit -m "Render daily SSC CGL post" || true
            git push
          fi

      - name: Wait for GitHub raw CDN propagation
        run: sleep 12

      - name: Publish to Instagram (@ssc1.daily)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 auto_post.py --publish-only

      - name: Save updated pyqs.json status
        run: |
          git config user.name "ssc1-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pyqs.json
          git commit -m "Mark PYQ as posted" || true
          git push
