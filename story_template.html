<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1.0" />
<title>SSC1 Daily Auto Story</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", "Noto Sans", "Noto Sans Devanagari", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: linear-gradient(165deg, #ffffff 0%, #fff7ed 48%, #ffedd5 100%);
    color: #18181b;
    padding: 250px 72px 260px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .canvas.theme-news {
    background: linear-gradient(165deg, #ffffff 0%, #fef2f2 48%, #ffedd5 100%);
  }

  .canvas.theme-sarcasm {
    background: linear-gradient(165deg, #ffffff 0%, #f8fafc 46%, #ffedd5 100%);
  }

  .orb-1 {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 680px;
    height: 680px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(251, 146, 60, 0.26) 0%, rgba(253, 186, 116, 0.12) 50%, rgba(255, 255, 255, 0) 75%);
    filter: blur(22px);
    pointer-events: none;
  }

  .orb-2 {
    position: absolute;
    bottom: -140px;
    left: -140px;
    width: 680px;
    height: 680px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.20) 0%, rgba(254, 215, 170, 0.10) 50%, rgba(255, 255, 255, 0) 75%);
    filter: blur(24px);
    pointer-events: none;
  }

  .layer {
    position: relative;
    z-index: 1;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cat-pill {
    display: inline-flex;
    align-items: center;
    padding: 13px 26px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.80);
    backdrop-filter: blur(22px);
    border: 1.5px solid rgba(255, 255, 255, 0.96);
    box-shadow: 0 10px 26px rgba(234, 88, 12, 0.08), inset 0 2px 2px rgba(255, 255, 255, 0.95);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #c2410c;
  }

  .cat-pill.news {
    background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
    border-color: rgba(254, 202, 202, 0.8);
    color: #ffffff;
    box-shadow: 0 12px 26px rgba(220, 38, 38, 0.28);
  }

  .date-pill {
    display: inline-flex;
    align-items: center;
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(18px);
    border: 1.5px solid rgba(255, 255, 255, 0.94);
    font-size: 21px;
    font-weight: 700;
    color: #52525b;
  }

  /* Minimal Editorial iOS Liquid Glass Card */
  .glass-card {
    margin: auto 0;
    padding: 66px 56px;
    border-radius: 44px;
    background: rgba(255, 255, 255, 0.76);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 2px solid rgba(255, 255, 255, 0.98);
    box-shadow:
      0 28px 60px rgba(234, 88, 12, 0.09),
      0 6px 20px rgba(0, 0, 0, 0.03),
      inset 0 3px 3px rgba(255, 255, 255, 0.98);
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  .accent-bar {
    width: 68px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ea580c 0%, #fb923c 100%);
  }

  .headline {
    font-size: 54px;
    font-weight: 800;
    line-height: 1.24;
    letter-spacing: -0.9px;
    color: #18181b;
  }

  .body-text {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.46;
    color: #3f3f46;
  }

  .highlight-box {
    padding: 28px 32px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(255, 247, 237, 0.92) 0%, rgba(255, 237, 213, 0.82) 100%);
    border: 1.5px solid rgba(251, 146, 60, 0.42);
    font-size: 31px;
    font-weight: 700;
    line-height: 1.42;
    color: #9a3412;
  }

  .source-line {
    font-size: 22px;
    font-weight: 700;
    color: #71717a;
    letter-spacing: 0.3px;
  }

  .brand {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #a1a1aa;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="canvas {{ theme_class }}">
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="top-row layer">
      <div class="cat-pill {{ 'news' if is_news else '' }}">{{ category_badge }}</div>
      <div class="date-pill">{{ date_label }}</div>
    </div>

    <div class="glass-card layer">
      <div class="accent-bar"></div>
      <div class="headline">{{ headline }}</div>
      {% if body_text %}
      <div class="body-text">{{ body_text }}</div>
      {% endif %}
      {% if highlight_text %}
      <div class="highlight-box">{{ highlight_text }}</div>
      {% endif %}
      {% if source_text %}
      <div class="source-line">{{ source_text }}</div>
      {% endif %}
    </div>

    <div class="brand layer">@SSC1.DAILY</div>
  </div>
</body>
</html>
